<style>

<script>
/* ============================================================
   COMPARATIVE (-er / more ... than) ARCADE ADVENTURE · ป.4
   ✔ 4 ทักษะ: อ่าน(ออกเสียง+AI ตรวจ) ฟัง พูด(AI ตรวจ) เขียน
   ✔ ล็อกอิน ชื่อ/ชั้น/เลขที่ · รายงานครู · ส่งออก CSV
   ============================================================ */
const GOOGLE_SCRIPT_URL="";   /* ใส่ URL Google Apps Script (ถ้าไม่ใช้ ปล่อยว่าง) */
const DEFAULT_PASS="1234";    /* รหัสผ่านโหมดครู */

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=960,H=540;
const $=id=>document.getElementById(id);
const IS_TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH)document.body.classList.add('touch');
const getSR=()=>window.SpeechRecognition||window.webkitSpeechRecognition;

/* ---------- 0) นักเรียน + รายงาน ---------- */
const STKEY='cmp_student_v1',RPKEY='cmp_report_v1',PWKEY='cmp_pass_v1';
let STU={name:'',cls:'',no:''},REP=[],SID=0;
const TYPN={read:'อ่านออกเสียง (AI ตรวจ)',readtap:'อ่าน (เลือกตอบ-ไม่มีไมค์)',listen:'ฟัง',type:'เขียน (พิมพ์)',order:'เรียงประโยค',speak:'พูด'};
function loadStu(){try{const d=JSON.parse(localStorage.getItem(STKEY)||'null');if(d)STU=d;}catch(e){}}
function saveStu(){try{localStorage.setItem(STKEY,JSON.stringify(STU));}catch(e){}}
function loadRep(){try{REP=JSON.parse(localStorage.getItem(RPKEY)||'[]');}catch(e){REP=[];}}
function saveRep(){try{if(REP.length>4000)REP=REP.slice(-4000);localStorage.setItem(RPKEY,JSON.stringify(REP));}catch(e){}}
function getPass(){try{return localStorage.getItem(PWKEY)||DEFAULT_PASS;}catch(e){return DEFAULT_PASS;}}
function setPass(p){try{localStorage.setItem(PWKEY,p);}catch(e){}}
function cloudSend(rec){if(!GOOGLE_SCRIPT_URL||GOOGLE_SCRIPT_URL.indexOf('http')!==0)return;
  try{fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});}catch(e){}}
function pushRec(o){const rec=Object.assign({t:Date.now(),sid:SID,name:STU.name,cls:STU.cls,no:STU.no},o);REP.push(rec);saveRep();cloudSend(rec);}
function logAns(ok,userAns,tkey){
  if(!curQ||!curQ.d)return;const d=curQ.d,ty=tkey||curQ.type;let qt=d.q||'';
  if(ty==='order')qt='เรียงประโยค → '+d.a;
  if(ty==='speak')qt='อ่านออกเสียง → '+d.s;
  if(ty==='listen')qt=(d.q||'')+' | ประโยคที่ฟัง: '+d.s;
  if(ty==='read')qt='อ่านประโยค → '+d.q.replace('___',d.o[d.a]);
  pushRec({kind:'ans',lv:G.lv,type:TYPN[ty]||ty,q:qt,ans:(userAns||'-'),ok:!!ok,sec:Math.max(0,Math.round(qTot-qSec)),score:G.score});}

function loginCard(){
  G.st='menu';stopMusic();
  showCard('<h2>👋 ยินดีต้อนรับสู่ COMPARATIVE ARCADE</h2>'+
   '<p style="font-size:14px;margin:6px 0">กรอกข้อมูลก่อนเริ่มเล่น เพื่อบันทึกคะแนนส่งคุณครู</p>'+
   '<input class="txt" id="iName" placeholder="ชื่อ - นามสกุล" value="'+esc(STU.name||'')+'" autocomplete="off">'+
   '<input class="txt" id="iCls" placeholder="ชั้น เช่น ป.4/1" value="'+esc(STU.cls||'')+'" autocomplete="off">'+
   '<input class="txt" id="iNo" placeholder="เลขที่" inputmode="numeric" value="'+esc(STU.no||'')+'" autocomplete="off">'+
   '<div class="fb" id="lfb"></div><button class="btn" onclick="doLogin()">▶ เริ่มเล่น</button>'+
   '<button class="btn2" onclick="teacherGate()">🔐 โหมดครู</button>'+
   '<small class="hintline">ข้อมูลนี้จะติดไปกับคะแนนทุกข้อ เพื่อให้คุณครูตรวจย้อนหลังได้</small>');
  const go=e=>{if(e.key==='Enter')doLogin();};['iName','iCls','iNo'].forEach(id=>{const el=$(id);if(el)el.onkeydown=go;});}
function doLogin(){
  const n=$('iName').value.trim(),c=$('iCls').value.trim(),o=$('iNo').value.trim();
  if(!n||!c||!o){$('lfb').innerHTML='<span class="bd">⚠️ กรุณากรอกให้ครบทั้ง 3 ช่อง</span>';return;}
  STU={name:n,cls:c,no:o};saveStu();SID=Date.now();audioUnlock();SFX.ui();
  pushRec({kind:'login',lv:0,type:'เข้าสู่ระบบ',q:'-',ans:'-',ok:true,sec:0,score:0});hud();menu();}
function changeStudent(){STU={name:'',cls:'',no:''};saveStu();loginCard();}
window.doLogin=doLogin;window.changeStudent=changeStudent;window.loginCard=loginCard;

function checkOri(){const port=innerHeight>innerWidth;document.body.classList.toggle('portrait',IS_TOUCH&&port);
  if(IS_TOUCH&&port&&G.st==='play')togglePause();}
addEventListener('resize',checkOri);addEventListener('orientationchange',()=>setTimeout(checkOri,250));
function tryFull(){const el=document.documentElement;
  if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch(()=>{});
    if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}
  else document.exitFullscreen().catch(()=>{});}
window.tryFull=tryFull;$('bFull').onclick=()=>{audioUnlock();tryFull();};

/* ---------- 1) เสียง ---------- */
let ac=null,mst,mgain,sgain,muted=false;
function audioInit(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();
  mst=ac.createGain();mst.gain.value=.9;mst.connect(ac.destination);
  mgain=ac.createGain();mgain.gain.value=.28;mgain.connect(mst);
  sgain=ac.createGain();sgain.gain.value=.55;sgain.connect(mst);}
function audioUnlock(){audioInit();if(ac.state==='suspended')ac.resume();}
const SEMI={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function NF(n){const m=/^([A-G]#?)(\d)$/.exec(n);if(!m)return 440;return 440*Math.pow(2,(((+m[2]+1)*12+SEMI[m[1]])-69)/12);}
function blip(f,wave,dur,t,g,dest){if(!ac||muted)return;t=t||ac.currentTime;const o=ac.createOscillator(),v=ac.createGain();
  o.type=wave;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.012);
  v.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(v);v.connect(dest||sgain);o.start(t);o.stop(t+dur+.02);}
function sweep(f1,f2,dur,g){if(!ac||muted)return;const t=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();
  o.type='square';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(sgain);o.start(t);o.stop(t+dur+.02);}
function noise(t,dur,g,hp){if(!ac||muted)return;const n=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource();s.buffer=b;
  const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1200;const v=ac.createGain();v.gain.value=g;
  s.connect(f);f.connect(v);v.connect(mgain);s.start(t);}
function kick(t){if(!ac||muted)return;const o=ac.createOscillator(),v=ac.createGain();o.type='sine';
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  v.gain.setValueAtTime(.5,t);v.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(v);v.connect(mgain);o.start(t);o.stop(t+.18);}
const snare=t=>noise(t,.14,.3,1400),hat=t=>noise(t,.03,.09,6000);
const seq=(a,w,d,g,gap)=>a.forEach((f,i)=>setTimeout(()=>blip(f,w,d,0,g),i*gap));
const SFX={
 jump(){blip(520,'square',.14,0,.16);setTimeout(()=>blip(760,'square',.1,0,.12),50);},
 djump(){sweep(700,1400,.22,.18);setTimeout(()=>blip(1600,'triangle',.1,0,.12),80);},
 coin(){blip(1050,'square',.07,0,.18);setTimeout(()=>blip(1550,'square',.16,0,.16),60);},
 gem(){seq([880,1320,1760],'triangle',.18,.2,70);},
 stomp(){blip(300,'sawtooth',.1,0,.18);if(ac)noise(ac.currentTime,.1,.2,800);},
 hit(){blip(200,'sawtooth',.3,0,.25);setTimeout(()=>blip(120,'sawtooth',.3,0,.2),90);},
 bump(){blip(180,'square',.08,0,.22);setTimeout(()=>blip(520,'triangle',.12,0,.18),60);},
 correct(){seq([660,880,1100,1320],'square',.16,.18,85);},
 wrong(){seq([330,262,196],'sawtooth',.2,.18,110);},
 power(){seq([523,659,784,1046,1318],'triangle',.14,.16,60);},
 clear(){seq([523,587,659,784,880,1046,1318],'square',.22,.18,130);},
 bonus(){seq([784,988,1175,1568,1175,1568,1976],'square',.18,.2,95);},
 over(){seq([440,392,349,262,196],'triangle',.35,.2,180);},
 tickw(){blip(880,'square',.09,0,.16);},ui(){blip(880,'square',.05,0,.12);}};
const O=0;
const TRACKS={
1:{bpm:142,lw:'square',lead:['C5',O,'E5',O,'G5',O,'E5','G5','A5',O,'G5',O,'E5',O,O,O,'F5',O,'A5',O,'G5',O,'E5',O,'D5',O,'E5',O,'C5',O,O,O],
 bass:['C2',O,'C3',O,'G2',O,'C3',O,'F2',O,'F3',O,'G2',O,'B2',O],dr:['k',O,'h','s',O,'h','k',O,'k',O,'h','s',O,'h',O,'h']},
2:{bpm:112,lw:'triangle',lead:['A3',O,O,'C4',O,O,'E4',O,'D4',O,O,'C4',O,'A3',O,O,'G3',O,O,'B3',O,O,'D4',O,'C4',O,'B3',O,'A3',O,O,O],
 bass:['A1',O,O,O,'A1',O,'E2',O,'F1',O,O,O,'G1',O,'G2',O],dr:['k',O,O,O,'s',O,O,'h','k',O,O,'h','s',O,O,O]},
3:{bpm:168,lw:'sawtooth',lead:['E4','E4','G4','E4','B4','A4','G4','E4','D4','E4','G4','A4','B4',O,'A#4','B4','E5',O,'D5','B4','G4','B4','A4','G4','E4','G4','A4','B4','E4',O,O,O],
 bass:['E1','E1','E2','E1','G1','G1','A1','A1','E1','E1','E2','E1','B1','B1','A#1','A1'],dr:['k','h','s','h','k','k','s','h','k','h','s','h','k','s','s','h']}};
const trackOf=lv=>TRACKS[((lv-1)%3)+1];
let mStep=0,mNext=0,mTimer=null,mLv=1;
function startMusic(lv){audioInit();stopMusic();mLv=lv;mStep=0;mNext=ac.currentTime+.08;
  mTimer=setInterval(()=>{if(!ac)return;const T=trackOf(mLv),spb=60/T.bpm/2;
    while(mNext<ac.currentTime+.14){const t=mNext,s=mStep%32;
      if(T.lead[s])blip(NF(T.lead[s]),T.lw,spb*1.5,t,.15,mgain);
      const b=T.bass[mStep%16];if(b)blip(NF(b),'triangle',spb*1.6,t,.24,mgain);
      const d=T.dr[mStep%16];if(d==='k')kick(t);else if(d==='s')snare(t);else if(d==='h')hat(t);
      mNext+=spb;mStep++;}},30);}
function stopMusic(){if(mTimer){clearInterval(mTimer);mTimer=null;}}
if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}
function say(text,rate){if(!('speechSynthesis'in window)||muted)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||.88;u.pitch=1.05;
  const vs=speechSynthesis.getVoices();const v=vs.find(x=>/en[-_](US|GB)/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));
  if(v)u.voice=v;setTimeout(()=>speechSynthesis.speak(u),60);}

/* ---------- 2) คลังข้อสอบ: Comparative (-er / more) ---------- */

function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function genLevel(lv){
  const r=mul32(9871+lv*137),gy=H-60;const L={plat:[],coins:[],gem:[],ene:[],blk:[],pw:[],w:0,goal:0,gy:gy,bonus:false};
  const segs=[];let x=0;const gap=IS_TOUCH?[62,38]:[80,55];
  for(let i=0;i<15;i++){const w=210+Math.floor(r()*230);segs.push({x,w});x+=w+(i>0&&r()<.55?(gap[0]+Math.floor(r()*gap[1])):0);}

  for(let i=idxs.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idxs[i],idxs[j]]=[idxs[j],idxs[i]];}
  idxs.slice(0,6).sort((a,b)=>a-b).forEach((si,k)=>{const s=segs[si];L.blk.push({x:s.x+s.w/2-20,y:gy-142,w:40,h:40,used:false,lock:0,pop:0,i:k});});
  segs.forEach((s,i)=>{
    if(i>0&&r()<.62){const pw=90+Math.floor(r()*70),px=s.x+20+r()*Math.max(20,s.w-pw-30),py=gy-116-r()*16;

function genBonus(lv){
  const r=mul32(4242+lv*911),gy=H-60;const B={plat:[],coins:[],gem:[],ene:[],blk:[],pw:[],w:0,goal:0,gy:gy,bonus:true};
  const len=2900;B.plat.push({x:0,y:gy,w:len+420,h:120,t:'g'});B.w=len+560;B.goal=len+200;
  for(let i=0;i<14;i++){B.plat.push({x:200+i*190,y:gy-140-((i%3)*82),w:118,h:16,t:'p'});}
  const C=(x,y)=>B.coins.push({x,y,got:false});
  for(let i=0;i<26;i++){const bx=170+i*105;
    if(lv===1){for(let k=0;k<5;k++)C(bx+k*22,gy-120-Math.sin(k/4*Math.PI)*120);}
    else if(lv===2){for(let k=0;k<5;k++)C(bx+k*22,gy-110-((i+k)%5)*46);}
    else if(lv===3){for(let k=0;k<5;k++)C(bx,gy-100-k*54);}
    else if(lv===4){for(let k=0;k<6;k++){const an=k/6*Math.PI*2;C(bx+Math.cos(an)*48,gy-280+Math.sin(an)*48);}}
    else{for(let k=0;k<5;k++)C(bx+k*22,gy-160-Math.sin((i+k)/3)*110);}}
  for(let i=0;i<9;i++)B.gem.push({x:260+i*300,y:gy-330-((i%3)*38),got:false});
  ['star','clock','wing','heart','hint','wing','star'].forEach((t,i)=>B.pw.push({x:340+i*380,y:gy-210-((i%2)*70),w:30,h:30,t,got:false,bob:r()*6}));

let curQ=null,qTimer=null,qSec=0,qTot=0,hintUsed=false,warned=false;
const QTIME={read:90,listen:60,type:60,order:120,speak:90};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const norm=s=>s.toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ').trim();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const optsHtml=(o,ord)=>ord.map(i=>'<button class="opt" data-i="'+i+'">'+o[i]+'</button>').join('');

/* ตรวจเสียงพูด: ต้องมีคำ comparative ครบ + ตรงประโยค ≥70% */
function evalSpeech(alts,target,key){
  const tw=norm(target).split(' '),kw=norm(key).split(' ');let best={ok:false,pct:-1,txt:''};
  alts.forEach(a=>{const tk=norm(a).split(' '),r=tw.filter(w=>tk.includes(w)).length/tw.length;
    const ok=r>=.7&&kw.every(k=>tk.includes(k))&&(kw.includes('more')||!tk.includes('more'));
    if((ok&&!best.ok)||(ok===best.ok&&r>best.pct))best={ok,pct:r,txt:a};});
  return best;}
function recog(SR,cb){let got=false;const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;
  r.onresult=e=>{got=true;cb(Array.from(e.results[0]).map(x=>x.transcript));};
  r.onerror=e=>{if(!got){got=true;cb(null,e.error);}};
  r.onend=()=>{if(!got){got=true;cb(null,'no-speech');}};
  if('speechSynthesis'in window)speechSynthesis.cancel();
  try{r.start();}catch(_){got=true;cb(null,'fail');}}
const micErr=err=>(err==='not-allowed'||err==='service-not-allowed')?'⚠️ กรุณาอนุญาตให้ใช้ไมโครโฟน แล้วกดอีกครั้ง':'⚠️ ไม่ได้ยินเสียง ลองกดอีกครั้ง แล้วพูดให้ดังขึ้น';

function openQuiz(blk){
  G.st='quiz';stopMusic();
  const type=LVQ[G.lv][blk.i%6];curQ={blk,type};hintUsed=false;warned=false;qTot=QTIME[type]||60;qSec=qTot;
  const head='<h2>'+THEME[G.lv].ic+' ด่าน '+G.lv+' · ข้อ '+(G.qDone+1)+'/6</h2><div class="bar"><i id="qbar"></i></div>'+
    '<div id="qsec" style="font-size:13px;opacity:.9;margin-top:4px;font-weight:700">⏱ เหลือ '+fmt(qSec)+'</div>';
  ({read:qRead,listen:qListen,type:qType,order:qOrder,speak:qSpeak})[type](head);
  clearInterval(qTimer);
  qTimer=setInterval(()=>{qSec-=0.1;
    const b=$('qbar');if(b)b.style.width=Math.max(0,qSec/qTot*100)+'%';
    const s=$('qsec');if(s){s.textContent='⏱ เหลือ '+fmt(qSec);s.style.color=qSec<=10?'#ff8a8a':'';}
    if(!warned&&qSec<=10){warned=true;SFX.tickw();}
    if(qSec<=0){clearInterval(qTimer);finish(false,'⏰ หมดเวลา!','',' (ไม่ได้ตอบ/หมดเวลา)');}},100);}
const hintBtn=()=>'<button class="btn2" id="bh">💡 คำใบ้ ('+G.hint+')</button>';
function dimWrong(n,ans){shuffle([...document.querySelectorAll('.opt')].filter(b=>+b.dataset.i!==ans&&!b.dataset.dim)).slice(0,n)
  .forEach(b=>{b.dataset.dim=1;b.style.opacity=.25;if(!b.style.pointerEvents)b.disabled=true;});}
function bindMC(ans,tip,ansText){
  document.querySelectorAll('#op .opt').forEach(b=>b.onclick=()=>{
    const ok=+b.dataset.i===ans,picked=b.textContent;
    document.querySelectorAll('#op .opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===ans)x.classList.add('ok');else if(x===b)x.classList.add('no');});
    finish(ok,ok?'✅ เก่งมาก! ถูกต้อง':'❌ คำตอบที่ถูกคือ '+ansText,tip,picked);});}

/* ===== อ่าน: เด็กต้องอ่านประโยคเต็มออกเสียง · AI ฟังแล้วตรวจแทนการกดส่งคำตอบ ===== */
function qRead(head){
  const d=drawQ('mc');curQ.d=d;const full=d.q.replace('___',d.o[d.a]),key=d.o[d.a],SR=getSR(),ord=shuffle(d.o.map((_,i)=>i));

   (SR?'<button class="btn" id="brec">🎤 กดแล้วอ่านประโยคเต็ม</button>':'')+hintBtn()+'<div class="fb" id="fb">'+(SR?'ตัวอย่างวิธีอ่าน: อ่านทั้งประโยค ตั้งแต่คำแรกถึงคำสุดท้าย':'')+'</div>');

  $('bh').onclick=()=>{if(G.hint<1||hintUsed)return;G.hint--;hintUsed=true;SFX.ui();dimWrong(1,d.a);hud();saveGame();};
  if(SR)$('brec').onclick=()=>{const b=$('brec');b.disabled=true;b.classList.add('rec');$('fb').textContent='🎙️ กำลังฟัง... อ่านประโยคเต็มเลย!';
    recog(SR,(alts,err)=>{if(!$('brec')||G.st!=='quiz')return;b.classList.remove('rec');b.disabled=false;

      const r=evalSpeech(alts,full,key),pc=Math.max(0,Math.round(r.pct*100)),sh=(r.txt||'(ไม่ได้ยินชัด)')+' ['+pc+'%]';
      if(r.ok){b.disabled=true;$('fb').textContent='🗣️ ได้ยินว่า: "'+r.txt+'" ('+pc+'% ตรงกัน)';

      else{tries--;

        else{b.disabled=true;$('fb').textContent='🗣️ ได้ยินว่า: "'+(r.txt||'?')+'"';
          setTimeout(()=>finish(false,'❌ ประโยคที่ถูกคือ "'+full+'"',d.t,sh),900);}}});};}

  $('brec').onclick=()=>{const b=$('brec');b.disabled=true;b.classList.add('rec');$('fb').textContent='🎙️ กำลังฟัง... พูดเลย!';
    recog(SR,(alts,err)=>{if(!$('brec')||G.st!=='quiz')return;b.classList.remove('rec');b.disabled=false;
      if(!alts){$('fb').innerHTML=micErr(err);return;}
      const r=evalSpeech(alts,d.s,d.k),pc=Math.max(0,Math.round(r.pct*100)),sh=(r.txt||'(ไม่ได้ยินชัด)')+' ['+pc+'%]';

      else{tries--;
        if(tries>0)$('fb').innerHTML+=' — <span class="bd">ลองอีกครั้ง (เหลือ '+tries+' ครั้ง) ออกเสียง "'+d.k+'" ให้ชัด</span>';
        else{b.disabled=true;setTimeout(()=>finish(false,'❌ ลองฝึกอีกนะ ออกเสียงให้ครบทุกคำ','ประโยคที่ถูก: "'+d.s+'"',sh),900);}}});};}

function finish(ok,msg,tip,userAns){

    bonus=Math.round(Math.max(0,qSec/qTot*100)*1.2);gain=Math.round((200+bonus)*cm*(G.star>0?2:1));G.score+=gain;SFX.correct();

    if(Math.random()<.5)grant(['star','heart','hint','clock','wing'][Math.floor(Math.random()*5)]);}
  else{G.combo=0;SFX.wrong();}
  saveRun();const cm=G.combo>=5?3:G.combo>=3?2:G.combo>=2?1.5:1;
  setTimeout(()=>showCard('<h2>'+(ok?'🎉 CORRECT!':'💪 TRY AGAIN!')+'</h2><div class="q">'+msg+'</div>'+
   (ok?'<p style="font-size:15px">+'+gain+' คะแนน (เร็ว +'+bonus+' · คอมโบ x'+cm+(G.star>0?' · ⭐x2':'')+')</p>':'<p style="font-size:15px">ไม่เป็นไร! อ่านคำอธิบายแล้วไปต่อกันเลย</p>')+
   '<div class="tip">'+(tip||'')+'<br>'+TIP+'</div><button class="btn" onclick="closeQuiz()">▶ เล่นต่อ ('+G.qDone+'/6)</button>'),620);}

/* ---------- 7) ไอเทม ---------- */
function grant(t){SFX.power();
  if(t==='star'){G.star=900;pop('⭐ DOUBLE SCORE!','#ffd34d');}
  if(t==='heart'){G.heart=Math.min(5,G.heart+1);pop('🍄 +1 หัวใจ','#ff8fa3');}
  if(t==='hint'){G.hint++;pop('💡 +1 คำใบ้','#7fd8ff');}
  if(t==='clock'){G.time+=25;pop('⏱ +25 วินาที','#43e97b');}
  if(t==='wing'){G.wing=1200;pop('🪶 กระโดดได้ 3 ชั้น!','#c9b6ff');}
  hud();saveGame();}
const pop=(t,c)=>float.push({t,c,y:0,l:80});

/* ---------- 8) โขกกล่อง ---------- */
function bumpBlock(b){if(b.used||b.lock)return;b.lock=1;b.pop=12;SFX.bump();
  for(let i=0;i<14;i++)parts.push({x:b.x+20,y:b.y,vx:(Math.random()-.5)*4.5,vy:-Math.random()*4.5,c:['#ffd34d','#fff3b0'][i%2],l:24});openQuiz(b);}
function bumpAssist(){if(P.vy>0)return;
  for(const b of L.blk){if(b.used||b.lock)continue;const bot=b.y+b.h;
    if(P.x+P.w>b.x-8&&P.x<b.x+b.w+8&&P.y>=bot-4&&P.y<=bot+12){P.y=bot+1;P.vy=1;bumpBlock(b);return;}}}

/* ---------- 9) ลูปเกม ---------- */
const maxJumps=()=>(G.mode==='bonus'||G.wing>0)?3:2;
function hud(){
  $('hStu').textContent='👤 '+(STU.name?STU.name+' ('+STU.cls+'/'+STU.no+')':'-');

  $('hQ').textContent=G.mode==='bonus'?('💎 '+G.bgem):('📘 '+G.qDone+'/6');$('hTime').textContent='⏱ '+Math.ceil(G.time);
  $('hJump').textContent='🦶 x'+maxJumps()+(G.wing>0?'🪶':'');
  const cm=G.combo>=5?3:G.combo>=3?2:G.combo>=2?1.5:1;$('hMul').textContent='🔥 x'+cm+(G.star>0?'⭐':'');$('hHint').textContent='💡 '+G.hint;}
function hurt(){if(P.inv>0||G.star>0||G.mode==='bonus')return;G.heart--;G.combo=0;P.inv=110;SFX.hit();hud();if(G.heart<=0)gameOver();else saveRun();}
function gameOver(){
  G.st='over';stopMusic();SFX.over();G.best=Math.max(G.best,G.score);G.lvBest[G.lv]=Math.max(G.lvBest[G.lv]||0,G.score);G.run=null;saveGame();
  pushRec({kind:'end',lv:G.lv,type:'จบเกม (หัวใจหมด)',q:'ตอบถูก '+G.qOk+'/'+G.qDone+' ข้อ',ans:'-',ok:false,sec:0,score:G.score});
  showCard('<h2>💀 GAME OVER</h2><div class="q">คะแนนรวม '+G.score+'</div><p style="font-size:13px;opacity:.85">🏆 สูงสุด '+G.best+' · 💎 เพชรสะสม '+G.gems+' · 💾 บันทึกผลส่งครูแล้ว</p>'+
   '<div class="tip">'+TIP+'</div><button class="btn" onclick="startLevel('+G.lv+')">🔄 เล่นด่านนี้ใหม่</button><button class="btn2" onclick="toMenu()">🏠 เมนูหลัก</button>');}
function levelClear(){
  G.st='clear';stopMusic();SFX.clear();const tb=Math.round(G.time)*5,hb=G.heart*150;
  G.score+=tb+hb;G.best=Math.max(G.best,G.score);G.unlock=Math.max(G.unlock,Math.min(5,G.lv+1));
  G.lvBest[G.lv]=Math.max(G.lvBest[G.lv]||0,G.score);G.run=(G.lv<5)?{lv:G.lv+1,score:G.score,heart:G.heart,hint:G.hint}:null;saveGame();
  pushRec({kind:'clear',lv:G.lv,type:'ผ่านด่าน',q:THEME[G.lv].n+' · ตอบถูก '+G.qOk+'/6 ข้อ',ans:'ผ่าน',ok:true,sec:0,score:G.score});
  const nx=G.lv+1;
  showCard('<h2>🏁 ผ่านด่าน '+G.lv+' '+THEME[G.lv].n+' สำเร็จ!</h2><div class="q">ตอบคำถามครบ 6 ข้อ · ถูก '+G.qOk+'/6 🎉</div>'+
   '<p style="font-size:14px">โบนัสเวลา +'+tb+' · โบนัสหัวใจ +'+hb+'</p><p style="font-size:20px;margin-top:6px">รวม: <b style="color:#ffd34d">'+G.score+'</b></p>'+
   '<div class="tip">🎁 <b>ปลดล็อกด่านโบนัส '+BONUS[G.lv].ic+' '+BONUS[G.lv].n+'</b> — 30 วินาที กระโดดได้ 3 ชั้น เก็บเหรียญและเพชรให้มากที่สุด!</div>'+
   '<button class="btnB" onclick="startBonus()">🎁 เข้าด่านโบนัส!</button><br>'+
   (nx<=5?'<button class="btn2" onclick="startLevel('+nx+')">⏭ ข้ามไปด่าน '+nx+' '+THEME[nx].ic+'</button>':'<h2 style="margin-top:8px">🏆 คุณคือ COMPARATIVE MASTER!</h2>')+
   '<button class="btn2" onclick="toMenu()">🏠 เมนูหลัก</button>');}
function bonusEnd(){
  G.st='clear';stopMusic();SFX.bonus();const tb=Math.round(G.time)*20;
  G.score+=tb;G.gems+=G.bgem;G.best=Math.max(G.best,G.score);const nx=G.lv+1;G.mode='level';
  G.run=(nx<=5)?{lv:nx,score:G.score,heart:G.heart,hint:G.hint}:null;saveGame();
  pushRec({kind:'bonus',lv:G.lv,type:'ด่านโบนัส',q:BONUS[G.lv].n,ans:'เหรียญ '+G.bcoin+' · เพชร '+G.bgem,ok:true,sec:0,score:G.score});
  showCard('<h2>🎁 จบด่านโบนัส '+BONUS[G.lv].ic+' '+BONUS[G.lv].n+'</h2><div class="q">🪙 เหรียญ '+G.bcoin+' · 💎 เพชร '+G.bgem+'</div>'+
   '<p style="font-size:14px">โบนัสเวลาที่เหลือ +'+tb+'</p><p style="font-size:20px;margin-top:6px">คะแนนรวม: <b style="color:#ffd34d">'+G.score+'</b></p>'+
   '<div class="tip">'+TIP+'<br>✍️ จำไว้: tall<b>er</b> than · more beautiful than</div>'+
   (nx<=5?'<button class="btn" onclick="startLevel('+nx+')">▶ ไปด่าน '+nx+' '+THEME[nx].ic+'</button>':'<h2 style="margin-top:8px">🏆 จบครบทุกด่านแล้ว — COMPARATIVE MASTER!</h2>')+
   '<button class="btn2" onclick="toMenu()">🏠 เมนูหลัก</button>');}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function update(){
  tick++;if(G.st!=='play')return;
  const T=THEME[G.lv],bn=G.mode==='bonus';
  G.time-=1/60;if(G.star>0)G.star--;if(G.wing>0){G.wing--;if(G.wing===0)hud();}
  if(G.time<=0){G.time=0;if(bn)bonusEnd();else gameOver();return;}
  const sp=(G.lv===5&&!bn)?3.6:4.6;
  if(keys.ArrowLeft||keys.a||keys.A){P.vx=-sp;P.face=-1;}else if(keys.ArrowRight||keys.d||keys.D){P.vx=sp;P.face=1;}else P.vx*=.72;
  const mj=maxJumps(),jk=keys[' ']||keys.ArrowUp||keys.w||keys.W,pressed=jk&&!P.jkPrev;P.jkPrev=jk;
  if(pressed)P.buf=8;else P.buf=Math.max(0,P.buf-1);
  if(P.gr){P.coy=8;P.jumps=0;}else P.coy=Math.max(0,P.coy-1);
  if(!P.gr&&P.coy===0&&P.jumps===0)P.jumps=1;
  const JP=bn?-14.5:(G.lv===4?-13:G.lv===5?-9.5:-14.5);
  if(P.buf>0&&P.jumps<mj){
    if(P.jumps===0&&P.coy>0){P.vy=JP;SFX.jump();}
    else{P.vy=JP*.94;SFX.djump();rings.push({x:P.x+15,y:P.y+P.h,r:6,l:26});
      for(let i=0;i<12;i++){const an=i/12*Math.PI*2;parts.push({x:P.x+15,y:P.y+P.h,vx:Math.cos(an)*3,vy:Math.sin(an)*2+1,c:'#9fe6ff',l:22});}}
    P.jumps++;P.gr=false;P.buf=0;P.coy=0;}
  if(!jk&&P.vy<-5)P.vy*=.88;
  P.vy+=bn?.62:T.grav;if(P.vy>16)P.vy=16;if(G.lv===5&&!bn&&P.vy>4)P.vy=4;
  const boxes=L.plat.concat(L.blk.map(b=>({x:b.x,y:b.y,w:b.w,h:b.h,ref:b})));
  P.x+=P.vx;boxes.forEach(o=>{if(hit(P,o)){if(P.vx>0)P.x=o.x-P.w;else if(P.vx<0)P.x=o.x+o.w;P.vx=0;}});
  if(P.x<0)P.x=0;
  P.y+=P.vy;P.gr=false;
  boxes.forEach(o=>{if(hit(P,o)){
    if(P.vy>0){P.y=o.y-P.h;P.vy=0;P.gr=true;P.jumps=0;P.safe={x:P.x,y:P.y};}
    else if(P.vy<0){P.y=o.y+o.h;P.vy=1;if(o.ref)bumpBlock(o.ref);}}});
  bumpAssist();if(G.st!=='play')return;
  if(P.y>H+120){hurt();P.x=P.safe.x;P.y=P.safe.y-40;P.vy=0;P.jumps=0;if(G.heart>0)P.inv=110;}
  L.coins.forEach(c=>{if(!c.got&&Math.abs(c.x-(P.x+15))<24&&Math.abs(c.y-(P.y+20))<28){
    c.got=true;G.score+=10*(G.star>0?2:1);if(bn)G.bcoin++;SFX.coin();hud();
    for(let i=0;i<6;i++)parts.push({x:c.x,y:c.y,vx:(Math.random()-.5)*4,vy:-Math.random()*4,c:'#ffd34d',l:26});}});
  L.gem.forEach(g=>{if(!g.got&&hit(P,{x:g.x-20,y:g.y-26,w:40,h:40})){
    g.got=true;G.score+=150*(G.star>0?2:1);if(bn)G.bgem++;else G.gems++;SFX.gem();pop('💎 +150','#7fd8ff');hud();saveGame();
    for(let i=0;i<16;i++)parts.push({x:g.x,y:g.y,vx:(Math.random()-.5)*6,vy:-Math.random()*6,c:'#8ff0ff',l:34});}});
  L.pw.forEach(p=>{if(!p.got&&hit(P,{x:p.x-16,y:p.y-16,w:36,h:36})){p.got=true;grant(p.t);}});
  L.ene.forEach(e=>{if(e.dead)return;e.x+=e.dir*(G.lv===3?1.9:1.25);if(e.x<e.min||e.x>e.max)e.dir*=-1;
    e.fl=Math.sin(tick/12)*(G.lv===2||G.lv===4?6:0);const eb={x:e.x,y:e.y+e.fl,w:e.w,h:e.h};
    if(hit(P,eb)){
      if(P.vy>1&&P.y+P.h-P.vy<=eb.y+12){e.dead=1;P.vy=-9;P.jumps=Math.max(0,P.jumps-1);G.score+=50*(G.star>0?2:1);SFX.stomp();hud();
        for(let i=0;i<10;i++)parts.push({x:e.x+16,y:e.y,vx:(Math.random()-.5)*5,vy:-Math.random()*4,c:'#fff',l:24});}
      else if(G.star>0){e.dead=1;G.score+=100;SFX.stomp();hud();}
      else{hurt();P.vx=-P.face*7;P.vy=-7;}}});
  if(P.inv>0)P.inv--;
  if(P.x>L.goal){if(bn)return bonusEnd();if(G.qDone>=6)return levelClear();}
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--;});parts=parts.filter(p=>p.l>0);
  rings.forEach(r=>{r.r+=2.2;r.l--;});rings=rings.filter(r=>r.l>0);
  float.forEach(f=>{f.y-=1;f.l--;});float=float.filter(f=>f.l>0);
  cam+=((P.x-330)-cam)*.12;cam=Math.max(0,Math.min(cam,L.w-W));if(tick%20===0)hud();}

/* ---------- 10) วาดภาพ ---------- */
function draw(){
  const T=THEME[G.lv],bn=L&&L.bonus;const g=ctx.createLinearGradient(0,0,0,H);
  if(bn){g.addColorStop(0,'#3a1d6e');g.addColorStop(1,'#b06bd8');}else{g.addColorStop(0,T.sky[0]);g.addColorStop(1,T.sky[1]);}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(G.st==='menu'||!L){bgDeco(1);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);return;}
  if(bn)bonusDeco();else bgDeco(G.lv);
  ctx.save();ctx.translate(-cam,0);
  L.plat.forEach(p=>{ctx.fillStyle=bn?'#5a3a86':T.gr;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle=bn?'#ffd34d':T.tp;ctx.fillRect(p.x,p.y,p.w,p.t==='g'?14:18);
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,p.h);
    if(p.t==='g'&&!bn){ctx.strokeStyle='rgba(0,0,0,.12)';for(let i=0;i<p.w;i+=32)ctx.strokeRect(p.x+i,p.y+14,32,30);}});
  L.coins.forEach(c=>{if(c.got)return;const b=Math.sin(tick/9+c.x)*3;ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('🪙',c.x,c.y+b);});
  L.gem.forEach(gm=>{if(gm.got)return;const b=Math.sin(tick/13+gm.x)*6;ctx.globalAlpha=.35;ctx.fillStyle='#8ff0ff';ctx.beginPath();ctx.arc(gm.x,gm.y+b-8,20,0,7);ctx.fill();
    ctx.globalAlpha=1;ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('💎',gm.x,gm.y+b);});
  L.blk.forEach(b=>{if(b.pop>0)b.pop--;
    const bump=b.pop>0?-Math.sin(b.pop/12*Math.PI)*10:((!b.used&&Math.sin(tick/14+b.i)>.9)?-2:0);
    ctx.fillStyle=b.used?'#8d7b5a':'#f2b33d';ctx.fillRect(b.x,b.y+bump,b.w,b.h);ctx.strokeStyle='#5a3d10';ctx.lineWidth=3;ctx.strokeRect(b.x,b.y+bump,b.w,b.h);
    ctx.fillStyle=b.used?'#5a4a30':'#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText(b.used?'✔':'?',b.x+20,b.y+30+bump);
    if(!b.used&&Math.abs((P.x+15)-(b.x+20))<120){ctx.fillStyle='rgba(255,211,77,'+(.55+Math.sin(tick/8)*.4)+')';ctx.font='bold 18px sans-serif';ctx.fillText('⬆ กระโดดโขก!',b.x+20,b.y-16+bump);}});
  const IC={star:'⭐',heart:'🍄',hint:'💡',clock:'⏱️',wing:'🪶'};
  L.pw.forEach(p=>{if(p.got)return;const b=Math.sin(tick/16+p.bob)*7;ctx.font='30px serif';ctx.textAlign='center';ctx.fillText(IC[p.t],p.x,p.y+b);});
  L.ene.forEach(e=>{if(e.dead)return;ctx.font='30px serif';ctx.textAlign='center';ctx.fillText(T.en,e.x+16,e.y+e.fl+28);});
  const gx=L.goal,open=bn?true:G.qDone>=6;
  ctx.fillStyle='#ddd';ctx.fillRect(gx,L.gy-230,8,230);ctx.fillStyle=open?'#43e97b':'#888';ctx.beginPath();
  ctx.moveTo(gx+8,L.gy-225);ctx.lineTo(gx+78,L.gy-205);ctx.lineTo(gx+8,L.gy-185);ctx.fill();
  ctx.font='26px serif';ctx.textAlign='center';ctx.fillText(bn?'🎁':(open?'🏁':'🔒'),gx+40,L.gy-240);
  if(!open){ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText('ตอบให้ครบ 6 ข้อ ('+G.qDone+'/6)',gx+40,L.gy-266);}
  rings.forEach(r=>{ctx.strokeStyle='rgba(159,230,255,'+(r.l/26)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();});
  drawHero();parts.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5);});
  ctx.restore();
  if(bn){ctx.fillStyle='rgba(255,211,77,'+(.5+Math.sin(tick/10)*.3)+')';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText('🎁 BONUS STAGE · '+BONUS[G.lv].n,W/2,46);}
  float.forEach((f,i)=>{ctx.fillStyle=f.c;ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.globalAlpha=Math.min(1,f.l/40);ctx.fillText(f.t,W/2,140+f.y+i*32);ctx.globalAlpha=1;});
  if(G.star>0){ctx.fillStyle='rgba(255,211,77,'+(.08+Math.sin(tick/6)*.05)+')';ctx.fillRect(0,0,W,H);}}
function drawHero(){const x=P.x,y=P.y;
  if(!(P.inv>0&&tick%8<4)){
    if(G.wing>0){ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('🪶',x+(P.face>0?-8:38),y+18+Math.sin(tick/5)*3);}
    ctx.fillStyle='#e94b3c';ctx.fillRect(x+2,y,26,10);ctx.fillStyle='#ffd7a8';ctx.fillRect(x+4,y+9,22,13);
    ctx.fillStyle='#222';ctx.fillRect(x+(P.face>0?18:6),y+13,4,4);ctx.fillStyle='#2f6fd0';ctx.fillRect(x+2,y+22,26,13);
    ctx.fillStyle='#ffd34d';ctx.fillRect(x+11,y+24,8,6);ctx.fillStyle='#1b3f7a';
    const w=P.gr&&Math.abs(P.vx)>1?Math.sin(tick/4)*4:0;ctx.fillRect(x+4,y+35,9,7+w);ctx.fillRect(x+17,y+35,9,7-w);
    if(G.star>0){ctx.strokeStyle='#ffd34d';ctx.lineWidth=3;ctx.strokeRect(x-3,y-3,P.w+6,P.h+6);}}
  if(!P.gr){const left=maxJumps()-P.jumps;for(let i=0;i<left;i++){ctx.fillStyle='#9fe6ff';ctx.fillRect(x+3+i*10,y-11,7,4);}}}
function bonusDeco(){const px=cam*.4;ctx.textAlign='center';ctx.font='34px serif';
  for(let i=0;i<14;i++)ctx.fillText(['✨','🌟','🎈','🎉','💫'][i%5],((i*160-px*.5+tick*.3)%1600+1600)%1600-120,70+((i*83)%330));
  for(let i=0;i<40;i++){const bx=(i*47+tick*1.6)%W,by=(i*97+tick*.8)%H;ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(bx,by,3,3);}}
function bgDeco(lv){const px=cam*.35;ctx.textAlign='center';
  if(lv===1){ctx.fillStyle='#8ed17a';for(let i=0;i<9;i++){const x=(i*220-px%220)%1200-100;ctx.beginPath();ctx.arc(x+120,H-40,110,Math.PI,0);ctx.fill();}
    ctx.font='60px serif';for(let i=0;i<7;i++)ctx.fillText('🌳',((i*180-px)%1300+1300)%1300-120,H-60);ctx.font='40px serif';ctx.fillText('☁️',((tick/3)%1200)-100,80);}
  if(lv===2){ctx.fillStyle='#241640';for(let i=0;i<24;i++){const x=((i*90-px*.6)%1400+1400)%1400-100;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+26,0);ctx.lineTo(x+13,60+((i*37)%70));ctx.fill();}
    ctx.font='28px serif';for(let i=0;i<8;i++)ctx.fillText('💎',((i*230-px*.8)%1500+1500)%1500-100,H-180);}
  if(lv===3){ctx.fillStyle='#5a1508';for(let i=0;i<6;i++){const x=((i*260-px)%1500+1500)%1500-150;ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+150,H-230);ctx.lineTo(x+300,H);ctx.fill();}
    ctx.font='34px serif';for(let i=0;i<7;i++)ctx.fillText('🌋',((i*300-px*.7)%1600+1600)%1600-120,H-250);
    ctx.fillStyle='rgba(255,90,20,'+(.1+Math.sin(tick/18)*.05)+')';ctx.fillRect(0,0,W,H);}
  if(lv===4){ctx.font='60px serif';for(let i=0;i<10;i++)ctx.fillText('☁️',((i*190-px*.5+tick*.25)%1500+1500)%1500-120,70+((i*67)%320));ctx.font='40px serif';ctx.fillText('🌈',W-120,110);}
  if(lv===5){ctx.font='40px serif';for(let i=0;i<9;i++)ctx.fillText(['🐠','🐟','🐙','🪸','🐡'][i%5],((i*200-px*.6)%1500+1500)%1500-120,120+((i*93)%330));
    for(let i=0;i<26;i++){const bx=(i*61+tick*.4)%W,by=H-((i*47+tick*1.4)%H);ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(bx,by,3+(i%3),0,7);ctx.fill();}}}

/* ============================================================
   11) 🔐 โหมดครู : รหัสผ่าน + รายงาน + ส่งออก CSV
   ============================================================ */
let RKEYS=[],RFILTER='';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dts(t){const d=new Date(t);return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});}
function backHome(){if(STU.name)menu();else loginCard();}window.backHome=backHome;
function teacherGate(){if(G.st==='play')togglePause();G.st='teacher';stopMusic();
  showCard('<h2>🔐 โหมดครู</h2><p style="font-size:14px">หน้านี้สำหรับคุณครูเท่านั้น กรุณาใส่รหัสผ่าน</p>'+
   '<input class="txt" id="tp" type="password" placeholder="รหัสผ่าน" autocomplete="off"><div class="fb" id="tfb"></div>'+
   '<button class="btn" onclick="tpCheck()">🔓 เข้าสู่รายงาน</button><button class="btn2" onclick="backHome()">↩ กลับหน้าเกม</button>'+
   '<small class="hintline">รหัสเริ่มต้นคือ 1234 · เปลี่ยนได้ในหน้ารายงาน</small>');
  const el=$('tp');if(el){el.onkeydown=e=>{if(e.key==='Enter')tpCheck();};if(!IS_TOUCH)el.focus();}}
function tpCheck(){const v=$('tp').value;
  if(v===getPass()){SFX.ui();RFILTER='';teacherReport();}else{$('tfb').innerHTML='<span class="bd">❌ รหัสผ่านไม่ถูกต้อง</span>';$('tp').value='';SFX.wrong();}}
window.teacherGate=teacherGate;window.tpCheck=tpCheck;
function teacherReport(){
  loadRep();G.st='teacher';const q=RFILTER.trim().toLowerCase();
  const rows=REP.filter(r=>!q||((r.name+' '+r.cls+' '+r.no).toLowerCase().indexOf(q)>=0));
  const gp={};rows.forEach(r=>{const k=(r.cls||'-')+'|'+(r.no||'-')+'|'+(r.name||'-');(gp[k]=gp[k]||[]).push(r);});
  RKEYS=Object.keys(gp).sort((a,b)=>{const A=a.split('|'),B=b.split('|');return A[0]===B[0]?(parseInt(A[1],10)||0)-(parseInt(B[1],10)||0):A[0].localeCompare(B[0]);});
  let body='';
  RKEYS.forEach((k,i)=>{const list=gp[k],ansL=list.filter(r=>r.kind==='ans'),ok=ansL.filter(r=>r.ok).length;
    const best=list.reduce((m,r)=>Math.max(m,r.score||0),0),last=list.reduce((m,r)=>Math.max(m,r.t),0),pc=ansL.length?Math.round(ok/ansL.length*100):0,p=k.split('|');
    body+='<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td><td class="lft">'+esc(p[2])+'</td><td>'+ansL.length+'</td><td class="gd">'+ok+'</td><td class="bd">'+(ansL.length-ok)+'</td>'+
      '<td><b>'+pc+'%</b></td><td>'+best+'</td><td>'+dts(last)+'</td><td><button class="btn2" style="padding:4px 10px;min-height:0;font-size:12px" onclick="repDetail('+i+')">ดู</button></td></tr>';});
  if(!body)body='<tr><td colspan="10" style="padding:16px">— ยังไม่มีข้อมูล —</td></tr>';
  const totAns=rows.filter(r=>r.kind==='ans').length,totOk=rows.filter(r=>r.kind==='ans'&&r.ok).length;
  showCard('<h2>📊 รายงานผลการเรียน (โหมดครู)</h2><p style="font-size:13px;opacity:.9">นักเรียน '+RKEYS.length+' คน · ตอบทั้งหมด '+totAns+' ข้อ · ถูก '+totOk+' ข้อ ('+(totAns?Math.round(totOk/totAns*100):0)+'%)</p>'+
   '<input class="txt" id="fq" placeholder="🔎 ค้นหา ชื่อ / ชั้น / เลขที่" value="'+esc(RFILTER)+'">'+
   '<div class="wrap"><table class="tb"><thead><tr><th>ชั้น</th><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ตอบ</th><th>ถูก</th><th>ผิด</th><th>%</th><th>คะแนนสูงสุด</th><th>ล่าสุด</th><th>ราย<br>ละเอียด</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
   '<div style="margin-top:8px"><button class="btn4" onclick="exportCSV()">📥 ส่งออก CSV (Excel)</button><button class="btn2" onclick="changePass()">🔑 เปลี่ยนรหัสผ่าน</button>'+
   '<button class="btn3" onclick="clearReport()">🗑 ล้างรายงานทั้งหมด</button><button class="btn" onclick="backHome()">↩ กลับหน้าเกม</button></div>'+
   '<small class="hintline">ข้อมูลถูกเก็บในเครื่องนี้ (localStorage) แนะนำให้ส่งออก CSV เก็บไว้เป็นระยะ</small>');
  const f=$('fq');if(f)f.onkeydown=e=>{if(e.key==='Enter'){RFILTER=f.value;teacherReport();}};}
window.teacherReport=teacherReport;
function repDetail(i){const k=RKEYS[i];if(!k)return;const p=k.split('|');
  const list=REP.filter(r=>(r.cls||'-')===p[0]&&(r.no||'-')===p[1]&&(r.name||'-')===p[2]).slice().sort((a,b)=>b.t-a.t);let body='';
  list.forEach(r=>{const res=r.kind==='ans'?(r.ok?'<span class="gd">✔ ถูก</span>':'<span class="bd">✘ ผิด</span>'):'<span style="color:#ffd34d">'+esc(r.type)+'</span>';
    body+='<tr><td>'+dts(r.t)+'</td><td>'+(r.lv||'-')+'</td><td>'+esc(r.type)+'</td><td class="lft">'+esc(r.q)+'</td><td class="lft">'+esc(r.ans)+'</td><td>'+res+'</td><td>'+(r.sec||0)+'s</td><td>'+(r.score||0)+'</td></tr>';});
  if(!body)body='<tr><td colspan="8" style="padding:16px">— ไม่มีข้อมูล —</td></tr>';
  const ansL=list.filter(r=>r.kind==='ans'),ok=ansL.filter(r=>r.ok).length;
  showCard('<h2>👤 '+esc(p[2])+' · ชั้น '+esc(p[0])+' เลขที่ '+esc(p[1])+'</h2><p style="font-size:14px">ตอบ '+ansL.length+' ข้อ · ถูก <b class="gd">'+ok+'</b> · ผิด <b class="bd">'+(ansL.length-ok)+'</b> · คิดเป็น '+(ansL.length?Math.round(ok/ansL.length*100):0)+'%</p>'+
   '<div class="wrap"><table class="tb"><thead><tr><th>วัน-เวลา</th><th>ด่าน</th><th>ทักษะ</th><th>โจทย์</th><th>คำตอบนักเรียน / เสียงที่ AI ได้ยิน</th><th>ผล</th><th>เวลา</th><th>คะแนน</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
   '<div style="margin-top:8px"><button class="btn2" onclick="teacherReport()">↩ กลับหน้าสรุป</button><button class="btn3" onclick="delStudent('+i+')">🗑 ลบข้อมูลนักเรียนคนนี้</button></div>');}
window.repDetail=repDetail;
function delStudent(i){const k=RKEYS[i];if(!k)return;const p=k.split('|');
  if(!confirm('ลบข้อมูลทั้งหมดของ '+p[2]+' (ชั้น '+p[0]+' เลขที่ '+p[1]+') ใช่ไหม?'))return;
  REP=REP.filter(r=>!((r.cls||'-')===p[0]&&(r.no||'-')===p[1]&&(r.name||'-')===p[2]));saveRep();teacherReport();}
window.delStudent=delStudent;
function clearReport(){if(!confirm('⚠️ ลบรายงานของนักเรียนทั้งหมดใช่ไหม? (กู้คืนไม่ได้)'))return;if(!confirm('ยืนยันอีกครั้ง: ข้อมูลทั้งหมดจะถูกลบถาวร'))return;REP=[];saveRep();teacherReport();}
window.clearReport=clearReport;
function changePass(){const a=prompt('ใส่รหัสผ่านใหม่ (อย่างน้อย 4 ตัว):');if(a===null)return;
  if(a.length<4){alert('รหัสสั้นเกินไป');return;}const b=prompt('ยืนยันรหัสผ่านใหม่อีกครั้ง:');
  if(a!==b){alert('รหัสผ่านไม่ตรงกัน');return;}setPass(a);alert('✅ เปลี่ยนรหัสผ่านเรียบร้อยแล้ว');}
window.changePass=changePass;
function csvCell(v){v=String(v==null?'':v).replace(/"/g,'""');return '"'+v+'"';}
function exportCSV(){loadRep();if(!REP.length){alert('ยังไม่มีข้อมูลให้ส่งออก');return;}
  const head=['วัน-เวลา','ชื่อ-นามสกุล','ชั้น','เลขที่','ด่าน','ประเภท','โจทย์','คำตอบนักเรียน/เสียงที่AIได้ยิน','ผล','เวลาที่ใช้(วินาที)','คะแนนสะสม'];
  const lines=[head.map(csvCell).join(',')];
  REP.slice().sort((a,b)=>a.t-b.t).forEach(r=>{lines.push([dts(r.t),r.name,r.cls,r.no,r.lv||'',r.type,r.q,r.ans,r.kind==='ans'?(r.ok?'ถูก':'ผิด'):r.type,r.sec||0,r.score||0].map(csvCell).join(','));});
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date();
  a.href=url;a.download='รายงานคะแนน_Comparative_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);}
window.exportCSV=exportCSV;

/* ---------- 12) ลูปหลัก ---------- */
let acc=0,last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=now-last;last=now;if(dt>250)dt=250;acc+=dt;let steps=0;
  while(acc>=16.667&&steps<4){update();acc-=16.667;steps++;}draw();}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.st==='play')togglePause();});
addEventListener('beforeunload',()=>{if(G.st==='play'||G.st==='paused')saveRun();else saveGame();});
['pointerdown','touchstart','keydown'].forEach(ev=>document.body.addEventListener(ev,audioUnlock,{once:true}));
loadGame();loadStu();loadRep();checkOri();hud();
if(STU.name){SID=Date.now();menu();}else loginCard();
requestAnimationFrame(loop);
</script>
